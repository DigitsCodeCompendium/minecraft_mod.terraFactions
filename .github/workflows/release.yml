name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer with a 'v' prefix (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build "-Pmod_version=$RELEASE_VERSION"

      - name: Verify release artifact
        id: artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="build/libs/terrafactions-$RELEASE_VERSION.jar"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected release artifact was not produced: $artifact" >&2
            exit 1
          fi
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ steps.artifact.outputs.path }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG"
          "$RELEASE_ARTIFACT"
          --verify-tag
          --title "TerraFactions $RELEASE_VERSION"
          --generate-notes
